[project]
name = "kairn"
version = "0.0.1"
description = "Case-based worklog operations: MCP server, local UI, Drive sync, shared agent skill"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "jsonschema>=4",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "anyio>=4",   # tests: anyio.run で MCP Client を回す
  "httpx>=0.27", # tests: starlette.testclient / mcp.client の HTTP 経路
]

[project.scripts]
kairn = "kairn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
